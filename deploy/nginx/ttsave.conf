# Install in /etc/nginx/sites-available/ttsave after certificates exist.
# This file belongs inside the http context via sites-enabled.
# Paths/query strings and authorization headers must never enter access logs.
log_format ttsave_safe '$remote_addr $request_method $status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name tiksavemp4.online www.tiksavemp4.online;
    access_log /var/log/nginx/ttsave-access.log ttsave_safe;
    error_log /var/log/nginx/ttsave-error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://tiksavemp4.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tiksavemp4.online;
    ssl_certificate /etc/letsencrypt/live/tiksavemp4.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiksavemp4.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/ttsave-access.log ttsave_safe;
    error_log /var/log/nginx/ttsave-error.log crit;
    return 308 https://tiksavemp4.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tiksavemp4.online;
    ssl_certificate /etc/letsencrypt/live/tiksavemp4.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiksavemp4.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32k;
    access_log /var/log/nginx/ttsave-access.log ttsave_safe;
    error_log /var/log/nginx/ttsave-error.log crit;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host tiksavemp4.online;
        proxy_set_header X-Forwarded-Host tiksavemp4.online;
        proxy_set_header X-Forwarded-Proto $scheme;
        # One local Nginx peer: overwrite, never append a client-supplied chain.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        # SSE and file streams must not spool into Nginx buffers/temp files.
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }
}
